<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conta Soldi</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff6f7;
      color: #3d2d2d;
    }

    .app {
      min-height: 100vh;
      padding: 20px;
      display: grid;
      grid-template-columns: 250px 1fr;
      gap: 20px;
    }

    .sidebar {
      background: linear-gradient(#ffe7ec, #fff7f8);
      border: 2px solid #f4b9c4;
      border-radius: 32px;
      padding: 24px;
      box-shadow: 0 15px 35px rgba(212, 120, 140, 0.18);
    }

    .logo { text-align: center; margin-bottom: 28px; }

    h1 {
      color: #df5f83;
      font-size: 34px;
      margin: 8px 0 4px;
    }

    .subtitle { color: #b36a76; font-size: 15px; }

    .menu button {
      width: 100%;
      border: 0;
      background: transparent;
      padding: 15px 16px;
      text-align: left;
      font-size: 16px;
      border-radius: 18px;
      margin-bottom: 8px;
      color: #6b4148;
    }

    .menu button.active {
      background: #ffdce5;
      color: #cf466b;
      font-weight: bold;
    }

    .quote {
      margin-top: 24px;
      background: white;
      border: 1px solid #f5ccd4;
      border-radius: 26px;
      padding: 18px;
      text-align: center;
      color: #7a4b50;
      line-height: 1.5;
    }

    .main {
      background: rgba(255,255,255,0.75);
      border: 2px solid #f4b9c4;
      border-radius: 32px;
      padding: 28px;
      box-shadow: 0 15px 35px rgba(212, 120, 140, 0.12);
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      gap: 14px;
    }

    .hello h2 { font-size: 36px; margin: 0 0 8px; }
    .hello p { margin: 0; color: #80565b; font-size: 17px; }

    .date {
      border: 1px solid #f5c4cc;
      color: #df5f83;
      padding: 13px 20px;
      border-radius: 20px;
      background: #fff5f6;
      font-weight: bold;
      white-space: nowrap;
    }

    .cards {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      border: 1px solid #f3c7cf;
      border-radius: 22px;
      padding: 22px;
      min-height: 115px;
    }

    .card.big {
      background: linear-gradient(135deg, #fff2f5, white);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .label {
      color: #8b5a62;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .money { font-size: 42px; font-weight: bold; margin-top: 10px; }
    .small-money { font-size: 27px; font-weight: bold; margin-top: 12px; }

    .green { color: #63a11d; }
    .orange { color: #ec8a00; }
    .pink { color: #df5f83; }

    .content {
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      gap: 20px;
    }

    .panel {
      background: white;
      border: 1px solid #f3c7cf;
      border-radius: 24px;
      padding: 22px;
    }

    .panel h3 { margin: 0 0 18px; font-size: 23px; }

    .field {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-weight: bold;
      color: #8b5a62;
      margin-bottom: 7px;
    }

    input, select {
      width: 100%;
      border: 1px solid #f3c7cf;
      background: #fff8f9;
      border-radius: 15px;
      padding: 13px;
      font-size: 16px;
      outline: none;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: #fff0f3;
      padding: 6px;
      border-radius: 16px;
      margin-bottom: 14px;
    }

    .tabs button {
      border: 0;
      padding: 12px;
      border-radius: 13px;
      background: transparent;
      font-size: 16px;
      color: #77484f;
      cursor: pointer;
    }

    .tabs button.active {
      background: white;
      color: #df5f83;
      font-weight: bold;
    }

    .add-total {
      width: 100%;
      border: 0;
      background: linear-gradient(90deg, #f36d95, #ec85a2);
      color: white;
      padding: 16px;
      border-radius: 16px;
      font-size: 18px;
      font-weight: bold;
      margin-top: 10px;
      cursor: pointer;
    }

    .mini-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .person-card {
      border: 1px solid #f3c7cf;
      background: #fff8f9;
      border-radius: 20px;
      padding: 15px;
    }

    .person-card strong {
      display: block;
      color: #df5f83;
      font-size: 18px;
      margin-bottom: 8px;
    }

    .person-card div {
      font-size: 14px;
      color: #6b4148;
      line-height: 1.6;
    }

    .movement {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 12px;
      align-items: center;
      border-bottom: 1px solid #f6dde2;
      padding: 13px 0;
    }

    .movement-title {
      font-weight: bold;
      font-size: 17px;
    }

    .movement-info {
      color: #9a6b72;
      font-size: 14px;
      margin-top: 4px;
    }

    .amount {
      font-size: 18px;
      font-weight: bold;
      white-space: nowrap;
    }

    .delete {
      border: 0;
      background: #fff0f3;
      color: #df5f83;
      border-radius: 12px;
      padding: 9px 11px;
      cursor: pointer;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-top: 20px;
    }

    .actions button {
      border: 1px solid #f3c7cf;
      background: white;
      padding: 15px;
      border-radius: 18px;
      font-size: 16px;
      color: #7a4b50;
      cursor: pointer;
    }

    svg { display: block; }

    @media (max-width: 950px) {
      .app, .content, .cards, .mini-grid {
        grid-template-columns: 1fr;
      }

      .sidebar { display: none; }
      .main { padding: 20px; }
      .top { align-items: flex-start; flex-direction: column; }
      .money { font-size: 34px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">
        <div style="display:flex; justify-content:center;">
          <svg width="76" height="76" viewBox="0 0 64 64" fill="none">
            <circle cx="32" cy="32" r="24" fill="#FFB6C8"/>
            <ellipse cx="32" cy="38" rx="14" ry="10" fill="#FFA3BA"/>
            <circle cx="27" cy="38" r="2" fill="#D86A87"/>
            <circle cx="37" cy="38" r="2" fill="#D86A87"/>
            <circle cx="24" cy="28" r="2" fill="#4A3035"/>
            <circle cx="40" cy="28" r="2" fill="#4A3035"/>
          </svg>
        </div>
        <h1>Conta Soldi</h1>
        <div class="subtitle">Il tuo contatore di famiglia ♥</div>
      </div>

      <div class="menu">
        <button class="active">⌂ Dashboard</button>
        <button>▣ Spese</button>
        <button>♡ Famiglia</button>
        <button>⌁ Storico</button>
      </div>

      <div class="quote">
        Ogni risparmio è un passo verso i tuoi sogni ✨
      </div>
    </aside>

    <main class="main">
      <div class="top">
        <div class="hello">
          <h2>Ciao!</h2>
          <p>Ecco il riepilogo dei soldi della famiglia.</p>
        </div>
        <div class="date" id="dateBox"></div>
      </div>

      <section class="cards">
        <div class="card big">
          <div>
            <div class="label">Totale complessivo</div>
            <div class="money" id="saldoTotale">€ 0,00</div>
          </div>
          <svg width="82" height="82" viewBox="0 0 64 64" fill="none">
            <circle cx="32" cy="32" r="24" fill="#FFB6C8"/>
            <ellipse cx="32" cy="38" rx="14" ry="10" fill="#FFA3BA"/>
            <circle cx="27" cy="38" r="2" fill="#D86A87"/>
            <circle cx="37" cy="38" r="2" fill="#D86A87"/>
            <circle cx="24" cy="28" r="2" fill="#4A3035"/>
            <circle cx="40" cy="28" r="2" fill="#4A3035"/>
          </svg>
        </div>
        <div class="card">
          <div class="label green">Avuto</div>
          <div class="small-money" id="totaleEntrate">€ 0,00</div>
        </div>
        <div class="card">
          <div class="label orange">Speso</div>
          <div class="small-money" id="totaleSpese">€ 0,00</div>
        </div>
      </section>

      <section class="mini-grid" id="contiPersone"></section>

      <section class="content">
        <div class="panel">
          <h3>Aggiungi movimento</h3>

          <div class="tabs">
            <button id="btnEntrata" onclick="setTipo('entrata')">Entrata</button>
            <button id="btnSpesa" class="active" onclick="setTipo('spesa')">Spesa</button>
          </div>

          <div class="field">
            <label>Chi</label>
            <select id="persona">
              <option>Lara</option>
              <option>Mamma</option>
              <option>Papà</option>
              <option>Famiglia</option>
            </select>
          </div>

          <div class="field">
            <label>Cosa</label>
            <input id="descrizione" placeholder="Es. spesa, paghetta, regalo..." />
          </div>

          <div class="field">
            <label>Importo</label>
            <input id="importo" inputmode="decimal" placeholder="Es. 12,50" />
          </div>

          <button class="add-total" onclick="aggiungi()">♥ Aggiungi</button>
        </div>

        <div class="panel">
          <h3>Movimenti</h3>
          <div id="listaMovimenti"></div>
        </div>
      </section>

      <div class="actions">
        <button onclick="esporta()">Esporta</button>
        <button onclick="cancellaTutto()">Nuovo</button>
        <button onclick="alert('Tutto salvato automaticamente 💕')">Salva</button>
      </div>
    </main>
  </div>

  <script>
    let tipo = "spesa";
    const persone = ["Lara", "Mamma", "Papà", "Famiglia"];
    let movimenti = JSON.parse(localStorage.getItem("movimentiFamiglia")) || [];

    function euro(num) {
      return num.toLocaleString("it-IT", { style: "currency", currency: "EUR" });
    }

    function setTipo(nuovoTipo) {
      tipo = nuovoTipo;
      document.getElementById("btnEntrata").classList.toggle("active", tipo === "entrata");
      document.getElementById("btnSpesa").classList.toggle("active", tipo === "spesa");
    }

    function aggiungi() {
      const persona = document.getElementById("persona").value;
      const descrizione = document.getElementById("descrizione").value.trim();
      const importo = Number(document.getElementById("importo").value.replace(",", "."));

      if (!descrizione || !Number.isFinite(importo) || importo <= 0) {
        alert("Scrivi descrizione e importo giusto 💕");
        return;
      }

      movimenti.unshift({
        id: Date.now(),
        persona,
        descrizione,
        importo,
        tipo,
        data: new Date().toLocaleDateString("it-IT")
      });

      document.getElementById("descrizione").value = "";
      document.getElementById("importo").value = "";
      salva();
      render();
    }

    function elimina(id) {
      movimenti = movimenti.filter(m => m.id !== id);
      salva();
      render();
    }

    function salva() {
      localStorage.setItem("movimentiFamiglia", JSON.stringify(movimenti));
    }

    function calcola() {
      const dati = {
        entrate: 0,
        spese: 0,
        persone: {}
      };

      persone.forEach(p => dati.persone[p] = { entrate: 0, spese: 0 });

      movimenti.forEach(m => {
        if (m.tipo === "entrata") {
          dati.entrate += m.importo;
          dati.persone[m.persona].entrate += m.importo;
        } else {
          dati.spese += m.importo;
          dati.persone[m.persona].spese += m.importo;
        }
      });

      dati.saldo = dati.entrate - dati.spese;
      return dati;
    }

    function render() {
      const dati = calcola();

      document.getElementById("saldoTotale").textContent = euro(dati.saldo);
      document.getElementById("totaleEntrate").textContent = euro(dati.entrate);
      document.getElementById("totaleSpese").textContent = euro(dati.spese);

      const conti = document.getElementById("contiPersone");
      conti.innerHTML = "";

      persone.forEach(p => {
        const d = dati.persone[p];
        const saldo = d.entrate - d.spese;
        conti.innerHTML += `
          <div class="person-card">
            <strong>${p}</strong>
            <div>Quanto ha: <b>${euro(saldo)}</b></div>
            <div>Avuto: ${euro(d.entrate)}</div>
            <div>Speso: ${euro(d.spese)}</div>
          </div>
        `;
      });

      const lista = document.getElementById("listaMovimenti");
      if (movimenti.length === 0) {
        lista.innerHTML = "<p style='color:#9a6b72;'>Ancora nessun movimento.</p>";
        return;
      }

      lista.innerHTML = movimenti.map(m => `
        <div class="movement">
          <div>
            <div class="movement-title">${m.descrizione}</div>
            <div class="movement-info">${m.persona} · ${m.data}</div>
          </div>
          <div class="amount" style="color:${m.tipo === "entrata" ? "#63a11d" : "#df5f83"}">
            ${m.tipo === "entrata" ? "+" : "-"} ${euro(m.importo)}
          </div>
          <button class="delete" onclick="elimina(${m.id})">×</button>
        </div>
      `).join("");
    }

    function cancellaTutto() {
      if (!confirm("Vuoi cancellare tutti i movimenti?")) return;
      movimenti = [];
      salva();
      render();
    }

    function esporta() {
      let testo = "CONTA SOLDI\n\n";
      movimenti.forEach(m => {
        testo += `${m.data} - ${m.persona} - ${m.descrizione} - ${m.tipo}: ${euro(m.importo)}\n`;
      });

      const blob = new Blob([testo], { type: "text/plain" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "conta-soldi.txt";
      link.click();
    }

    document.getElementById("dateBox").textContent = new Date().toLocaleDateString("it-IT", {
      day: "2-digit", month: "long", year: "numeric"
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");
    }

    render();
  </script>
</body>
</html>
